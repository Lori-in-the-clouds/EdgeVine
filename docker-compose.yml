services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

  vineyard-dashboard:
    build:
      context: .
      dockerfile: vineyard-dashboard/Dockerfile
    container_name: vineyard-dashboard
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"
      ZONE_STALE_MINUTES: ${ZONE_STALE_MINUTES}
      ZONE_TEMPERATURE_MIN: ${ZONE_TEMPERATURE_MIN}
      ZONE_TEMPERATURE_MAX: ${ZONE_TEMPERATURE_MAX}
      ZONE_HUMIDITY_MIN: ${ZONE_HUMIDITY_MIN}
      ZONE_MOISTURE_MIN: ${ZONE_MOISTURE_MIN}
      CV_PYTHON: ${CV_PYTHON:-/opt/cv-venv/bin/python}
      PREDICTION_PYTHON: ${PREDICTION_PYTHON:-/opt/predictions-venv/bin/python}
      HOST: ${DASHBOARD_HOST}
      PORT: ${DASHBOARD_PORT}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./vineyard-dashboard:/app
      - /app/node_modules
      - ./CV:/CV
      - ./Predictions:/Predictions
    ports:
      - "${DASHBOARD_HOST_PORT}:${DASHBOARD_PORT}"
    restart: unless-stopped


volumes:
  postgres_data:
