services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: sensore_user
      POSTGRES_PASSWORD: sensore_password
      POSTGRES_DB: sensori
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensore_user -d sensori || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  vineyard-dashboard:
    build: vineyard-dashboard
    container_name: vineyard-dashboard
    environment:
      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: sensori
      POSTGRES_USER: sensore_user
      POSTGRES_PASSWORD: sensore_password
      DATABASE_URL: "postgresql://sensore_user:sensore_password@postgres:5432/sensori"
      # Soglie Sensori
      ZONE_STALE_MINUTES: 30
      ZONE_TEMPERATURE_MIN: 5
      ZONE_TEMPERATURE_MAX: 35
      ZONE_HUMIDITY_MIN: 35
      ZONE_MOISTURE_MIN: 250
      # Astro specifica: forza l'host per rendere visibile il sito fuori dal container
      HOST: 0.0.0.0
      PORT: 4321
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../vineyard-dashboard:/app
      - /app/node_modules # Evita che il node_modules del Mac sovrascriva quello del container
      - ../CV:/CV
    ports:
      # Mappiamo la porta 4321 del Mac alla 4321 del container
      - "${DASHBOARD_PORT:-4321}:4321"
    restart: unless-stopped

volumes:
  postgres_data:
