[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps = 
	xreef/EByte LoRa E220 library@^1.0.8
	bblanchon/ArduinoJson@^7.2.2
	adafruit/DHT sensor library@^1.4.7
